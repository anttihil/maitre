[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "maitre"
version = "0.1.0"
description = "A manager service for running multiple ML models locally on a VRAM budget."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.0",
    "typer>=0.12",
    "httpx>=0.27",
    "tomli-w>=1.0",
    "rich>=13.0",
]

[project.optional-dependencies]
nvidia = ["pynvml>=11.5"]
faster-whisper = ["faster-whisper>=1.0"]
llama-cpp = ["llama-cpp-python>=0.3"]
all-providers = ["maitre[nvidia,faster-whisper,llama-cpp]"]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.8"]

[project.scripts]
maitre = "maitre.cli:app"

[project.entry-points."maitre.providers"]
faster_whisper = "maitre.providers.faster_whisper:FasterWhisperProvider"
glm_ocr = "maitre.providers.glm_ocr:GLMOCRProvider"
llama_cpp = "maitre.providers.llama_cpp:LlamaCppProvider"

[tool.hatch.build.targets.wheel]
packages = ["src/maitre"]

[tool.ruff]
target-version = "py311"
line-length = 99

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
